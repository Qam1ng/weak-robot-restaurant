<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		html, body, #game-shell, #canvas {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			border: 0;
		}

		body {
			background: #242424;
			overflow: hidden;
			touch-action: none;
		}

		#game-shell {
			overflow: hidden;
		}

		#canvas {
			display: block;
			/* Keep the rendered canvas and pointer coordinates in the same box. */
			width: 100% !important;
			height: 100% !important;
			outline: none;
		}

		#loading {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #242424;
			color: #f2f2f2;
			font: 16px sans-serif;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<div id="game-shell">
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	</div>
	<div id="loading" role="status">Loading game...</div>

	<script src="$GODOT_URL"></script>
	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			const isEmbedded = params.get('embedded') === '1' && window.parent !== window;
			const qualtricsOrigin = 'https://jh.qualtrics.com';
			const canvas = document.getElementById('canvas');
			const loading = document.getElementById('loading');
			const config = $GODOT_CONFIG;
			config.canvas = canvas;

			if (isEmbedded) {
				// Qualtrics can resize its question container after this document loads.
				// Keep Godot at its designed 1600 x 1000 viewport and only scale the
				// canvas through CSS, so its rendering and input coordinates stay aligned.
				canvas.width = 1600;
				canvas.height = 1000;
				config.canvasResizePolicy = 0;
			} else {
				config.canvasResizePolicy = 2;
			}

			window.WeakRobotRestaurantEmbed = {
				isEmbedded: isEmbedded,
				complete: function () {
					if (!isEmbedded) {
						return false;
					}
					window.parent.postMessage(
						{ source: 'weak_robot_restaurant', type: 'game_completed' },
						qualtricsOrigin
					);
					return true;
				}
			};

			const engine = new Engine(config);
			engine.startGame({ canvas: canvas, canvasResizePolicy: config.canvasResizePolicy }).then(function () {
				loading.remove();
			}).catch(function (error) {
				console.error('Unable to start Weak Robot Restaurant.', error);
				loading.textContent = 'Unable to start the game. Please refresh and try again.';
			});
		}());
	</script>
</body>
</html>
